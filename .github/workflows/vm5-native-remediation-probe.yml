name: VM5 native remediation probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      MERGIFY_TOKEN: ${{ secrets.VM5_NATIVE_TOKEN }}
      PLAYWRIGHT_MERGIFY_INCLUDE_PROJECT_IN_TEST_NAME: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install current released Playwright integration
        run: |
          npm init -y
          npm install --save-dev @playwright/test@1.62.0 @mergifyio/playwright@0.3.7
      - name: Create minimal native-client test
        run: |
          mkdir -p vm5-native-tests
          cat > playwright.config.mjs <<'EOF'
          import { defineConfig } from '@playwright/test';
          import { withMergify } from '@mergifyio/playwright';
          export default withMergify(defineConfig({
            testDir: './vm5-native-tests',
            projects: [{ name: 'chromium' }],
          }));
          EOF
          cat > vm5-native-tests/native-remediation.spec.mjs <<'EOF'
          import { test, expect } from '@mergifyio/playwright';
          test('VM5_NATIVE_REMEDIATION_SETUP_20260918', async () => {
            expect('native-client').toBe('native-client');
          });
          EOF
      - name: Run current Mergify Playwright client
        run: npx playwright test --config=playwright.config.mjs --reporter=line
