name: vm5-trace-path-payload-matched

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matched-junit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Generate matched JUnit marker
        id: tests
        run: |
          cat > junit.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite name="vm5.trace.path.payload" tests="1" failures="0" errors="0" skipped="0" time="0.01">
            <testcase classname="vm5.trace.path.payload" name="VM5_TRACE_MATCHED_A_260917_K9D4" time="0.01" file="tests/matched_a.py" line="1" />
          </testsuite>
          XML
      - name: Upload matched JUnit through official Mergify action
        id: upload
        uses: Mergifyio/gha-mergify-ci@v25
        with:
          action: junit-process
          token: ${{ secrets.MERGIFY_TOKEN }}
          report_path: junit.xml
          job_name: vm5-trace-matched-a
          test_step_outcome: ${{ steps.tests.outcome }}
      - name: Show non-secret upload outcome
        run: echo "test_results_upload=${{ steps.upload.outputs.test_results_upload }}"
