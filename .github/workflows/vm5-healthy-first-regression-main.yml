name: vm5-healthy-first-regression-main

on:
  workflow_dispatch:
    inputs:
      mode:
        description: pass or fail
        required: true
        type: choice
        options:
          - pass
          - fail

permissions:
  contents: read

jobs:
  first-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build owner-controlled Playwright harness
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
          mkdir vm5-test && cd vm5-test
          cat > package.json <<'EOP'
          {
            "name": "vm5-healthy-first-regression",
            "private": true,
            "version": "1.0.0",
            "devDependencies": {
              "@mergifyio/playwright": "0.3.7",
              "@playwright/test": "1.62.1"
            }
          }
          EOP
          pnpm install --ignore-scripts --no-frozen-lockfile >/dev/null
          mkdir tests
          cat > playwright.config.mjs <<'EOC'
          import { defineConfig } from '@playwright/test';
          import { withMergify } from '@mergifyio/playwright';
          export default withMergify(defineConfig({
            testDir: './tests',
            workers: 1,
            projects: [{ name: 'chromium' }],
          }));
          EOC
          if [[ "$MODE" == "pass" ]]; then
            ASSERTION="expect('healthy-baseline').toBe('healthy-baseline');"
          else
            ASSERTION="expect('healthy-baseline').toBe('first-regression');"
          fi
          cat > tests/project-prefix.spec.mjs <<EOT
          import { test, expect } from '@mergifyio/playwright';
          test('VM5_HEALTHY_FIRST_REGRESSION_260917_B7D2', async () => {
            ${ASSERTION}
          });
          EOT
      - name: Run Playwright with Mergify
        working-directory: vm5-test
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
          PLAYWRIGHT_MERGIFY_INCLUDE_PROJECT_IN_TEST_NAME: 'true'
        run: pnpm exec playwright test --config playwright.config.mjs
