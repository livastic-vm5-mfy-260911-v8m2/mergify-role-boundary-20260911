name: vm5-custom-scope-current-fullchain

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  detect-scopes:
    runs-on: ubuntu-24.04
    outputs:
      critical: ${{ fromJSON(steps.scopes.outputs.scopes).critical }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Detect and upload Mergify scopes from documented custom config path
        id: scopes
        uses: Mergifyio/gha-mergify-ci@v25
        with:
          action: scopes
          token: ${{ secrets.MERGIFY_TOKEN }}
          mergify_config_path: .ci/mergify-scopes.yml

  critical-required:
    needs: detect-scopes
    if: ${{ needs.detect-scopes.outputs.critical == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deterministic critical regression detector
        run: |
          echo 'VM5_CUSTOM_SCOPE_CRITICAL_REGRESSION_DETECTED'
          exit 1

  ci-gate:
    if: ${{ !cancelled() }}
    needs:
      - detect-scopes
      - critical-required
    runs-on: ubuntu-24.04
    steps:
      - name: Aggregate official selective-CI jobs
        uses: Mergifyio/gha-mergify-ci@v25
        with:
          action: wait-jobs
          jobs: ${{ toJSON(needs) }}
