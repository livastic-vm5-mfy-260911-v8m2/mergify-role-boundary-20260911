name: VM5 read-only GITHUB_TOKEN Mergify auth proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Prove GITHUB_TOKEN cannot write repository contents
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload='{"message":"VM5 should not write","content":"UkVBRE9OTFkK"}'
          code=$(curl -sS -o /tmp/gh-write.json -w '%{http_code}' \
            -X PUT \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            --data "${payload}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/vm5-readonly-token-should-not-write.txt")
          echo "GITHUB_CONTENTS_WRITE_HTTP=${code}"
          python3 - <<'PY2'
          import json
          try:
              d=json.load(open('/tmp/gh-write.json'))
              print('GITHUB_WRITE_MESSAGE='+str(d.get('message',''))[:300])
          except Exception:
              pass
          PY2
          if [[ "${code}" == "200" || "${code}" == "201" ]]; then
            echo 'Unexpected GitHub write authority'
            exit 90
          fi

      - name: Try Mergify queue pause with the same read-only token
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/mergify-pause.json -w '%{http_code}' \
            -X PUT \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data '{"reason":"VM5 read-only GITHUB_TOKEN proof 20260913"}' \
            "https://api.mergify.com/v1/repos/${GITHUB_REPOSITORY}/merge-queue/pause")
          echo "MERGIFY_QUEUE_PAUSE_HTTP=${code}"
          python3 - <<'PY2'
          import json
          try:
              d=json.load(open('/tmp/mergify-pause.json'))
              print('MERGIFY_PAUSE_BODY='+json.dumps(d,separators=(',',':'))[:600])
          except Exception:
              print('MERGIFY_PAUSE_BODY=<non-json>')
          PY2
