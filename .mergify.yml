pull_request_rules:
  - name: vm5 postcheck multi migration probe
    conditions:
      - base = main
    actions:
      post_check:
        success_conditions:
          - label = vm5-pc-success-a
          - label = vm5-pc-success-b
        neutral_conditions:
          - label = vm5-pc-neutral-a
          - label = vm5-pc-neutral-b
        title: "VM5 postcheck migration probe"
        summary: "controlled multi-condition migration probe"

queue_rules:
  - name: default
    queue_conditions: []
    merge_conditions:
      - check-success = vm5-never-pass-dequeue-authz-260917
    merge_method: merge
