pull_request_rules:
  - name: vm5 autoqueue safe docs
    conditions:
      - title = VM5 queue files safe docs 260917
    actions:
      queue:
        name: default
  - name: vm5 autoqueue critical code
    conditions:
      - title = VM5 queue files critical code 260917
    actions:
      queue:
        name: default

merge_queue:
  mode: serial
  max_parallel_checks: 1

queue_rules:
  - name: default
    batch_size: 2
    queue_conditions: []
    merge_conditions:
      - or:
          - check-success = vm5-required-critical-ci-260917
          - -files ~= ^critical/
      - check-success = vm5-never-merge-queue-files-260917
    merge_method: merge
